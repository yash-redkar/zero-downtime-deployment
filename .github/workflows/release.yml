name: StreamShield Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Clean Release Package
        run: |
          PACKAGE_NAME="streamshield-${{ github.ref_name }}"
          mkdir -p "$PACKAGE_NAME"

          cp -r app "$PACKAGE_NAME/"
          cp -r k8s "$PACKAGE_NAME/"
          cp -r docs "$PACKAGE_NAME/" || true
          cp -r monitoring "$PACKAGE_NAME/" || true
          cp -r scripts "$PACKAGE_NAME/" || true
          cp -r load-tests "$PACKAGE_NAME/" || true

          cp README.md "$PACKAGE_NAME/" || true
          cp QUICK_START_DEMO.md "$PACKAGE_NAME/" || true
          cp PROJECT_AUDIT.md "$PACKAGE_NAME/" || true

          cat > "$PACKAGE_NAME/BUILD_INFO.txt" << EOF
          StreamShield Release Artifact
          Version: ${{ github.ref_name }}
          Commit SHA: ${{ github.sha }}
          Generated By: GitHub Actions
          Workflow: StreamShield Release

          Package Contents:
          - Application source
          - Kubernetes manifests
          - Monitoring configs
          - Rollback scripts
          - Load test files
          - Documentation
          EOF

          zip -r "$PACKAGE_NAME.zip" "$PACKAGE_NAME"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamshield-${{ github.ref_name }}
          path: streamshield-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: streamshield-${{ github.ref_name }}.zip