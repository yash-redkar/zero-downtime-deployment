apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamshield-green
  namespace: streamshield
  labels:
    app: streamshield
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamshield
      version: green
  template:
    metadata:
      labels:
        app: streamshield
        version: green
    spec:
      containers:
        - name: streamshield-green
          image: streamshield-v2:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2-green"
            - name: RELEASE_STAGE
              value: "green"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15