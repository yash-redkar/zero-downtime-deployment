# =============================================================================
# StreamShield Simulator — Green Deployment (Release Candidate v2)
# =============================================================================
#
# GREEN ENVIRONMENT — RELEASE CANDIDATE
# ──────────────────────────────────────
# The Green environment runs streamshield-v2 and represents the NEW release
# being tested before it is promoted to production. In a Blue-Green strategy:
#
#   BLUE  = current stable production (users are here)
#   GREEN = new release candidate (being validated here)
#
# The Green environment allows the team to:
#   1. Test v2 in a real Kubernetes environment (not just local)
#   2. Run health checks and verify readiness probes pass
#   3. Validate chaos mode simulation without impacting v1 users
#   4. Prepare for traffic switching (Phase 3 — Ingress canary)
#
# At this stage, Green runs independently alongside Blue.
# Users are NOT yet sent to Green. Traffic switching comes in Phase 3.
#
# Apply with:
#   kubectl apply -f k8s/green-deployment.yaml
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamshield-green
  namespace: streamshield           # Must match namespace.yaml
  labels:
    app: streamshield
    version: v2
    environment: green
    release-role: candidate         # Green = release candidate, not yet production

spec:
  # ── Replica Count ────────────────────────────────────────────────────────
  # 2 replicas ensure the green environment itself is resilient during
  # testing. If one pod crashes during validation, testing continues.
  replicas: 2

  # ── Selector ─────────────────────────────────────────────────────────────
  # Kubernetes uses this to identify which pods belong to this Deployment.
  # The labels here must exactly match template.metadata.labels below.
  selector:
    matchLabels:
      app: streamshield
      version: v2
      environment: green

  # ── Pod Template ─────────────────────────────────────────────────────────
  # Blueprint for every Green pod created by this Deployment.
  template:
    metadata:
      labels:
        app: streamshield
        version: v2
        environment: green
        release-role: candidate     # Marks these pods as "not yet production"

    spec:
      containers:
        - name: streamshield-v2
          image: streamshield-v2:latest

          # ── imagePullPolicy: Never ────────────────────────────────────────
          # IMPORTANT: This tells Kubernetes NOT to pull from Docker Hub.
          # Instead, use the image already loaded into Minikube's registry.
          #
          # Before applying this file, you MUST run:
          #   minikube image load streamshield-v2:latest
          #
          # Without this step, the pod will fail with ImagePullBackOff error
          # because Kubernetes cannot find the image in any remote registry.
          imagePullPolicy: Never

          # Flask app listens on port 5000 inside the container
          ports:
            - containerPort: 5000
              name: http

          # ── Resource Limits ───────────────────────────────────────────────
          # Same resource profile as Blue. This ensures a fair comparison —
          # both environments run with identical resource constraints.
          #
          # requests = guaranteed minimum (used by scheduler)
          # limits   = hard maximum (container is throttled if exceeded)
          #
          # If v2 has a memory leak or CPU spike during chaos testing,
          # the limits will contain the damage to this pod only.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
