apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamshield-blue
  namespace: streamshield
  labels:
    app: streamshield
    version: v1
    environment: blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: streamshield
      version: v1
      environment: blue

  template:
    metadata:
      labels:
        app: streamshield
        version: v1
        environment: blue

    spec:
      containers:
        - name: streamshield-v1
          image: zero-downtime-deployment-v1:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"