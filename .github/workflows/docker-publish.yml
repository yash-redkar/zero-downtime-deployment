name: Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push StreamShield v1
        uses: docker/build-push-action@v5
        with:
          context: ./app/v1
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/streamshield-v1:latest
            ${{ secrets.DOCKER_USERNAME }}/streamshield-v1:${{ github.sha }}

      - name: Build and Push StreamShield v2
        uses: docker/build-push-action@v5
        with:
          context: ./app/v2
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/streamshield-v2:latest
            ${{ secrets.DOCKER_USERNAME }}/streamshield-v2:${{ github.sha }}

      - name: Workflow Summary
        run: |
          echo "## Docker Publish Successful 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- streamshield-v1" >> $GITHUB_STEP_SUMMARY
          echo "- streamshield-v2" >> $GITHUB_STEP_SUMMARY