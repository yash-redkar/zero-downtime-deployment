apiVersion: batch/v1
kind: Job
metadata:
  name: streamshield-postgres-init
  namespace: streamshield
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamshield-postgres-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -h streamshield-postgres -U streamshield_admin -d streamshield_db <<'SQL'
              CREATE TABLE IF NOT EXISTS deployments (
                id SERIAL PRIMARY KEY,
                version VARCHAR(50) NOT NULL,
                environment VARCHAR(50) NOT NULL,
                strategy VARCHAR(50) NOT NULL,
                status VARCHAR(50) NOT NULL,
                deployed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS health_scores (
                id SERIAL PRIMARY KEY,
                version VARCHAR(50) NOT NULL,
                score INTEGER NOT NULL,
                error_rate NUMERIC(5,2),
                latency_ms INTEGER,
                recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS rollback_events (
                id SERIAL PRIMARY KEY,
                from_version VARCHAR(50),
                to_version VARCHAR(50),
                reason TEXT,
                severity VARCHAR(20),
                triggered_by VARCHAR(100),
                rollback_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              INSERT INTO deployments(version, environment, strategy, status)
              VALUES ('v1-blue-stable', 'production', 'blue-green', 'active');
              SQL